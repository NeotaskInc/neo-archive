[package]
name = "neoarchive-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
regex = "1"
fs4 = "0.13"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = { version = "0.25.0", default-features = false, features = ["mmap", "lz4-compression"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
